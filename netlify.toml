# Focus Ledger is plain static files — there is nothing to build.
[build]
  publish = "."

# The service worker must never be served stale, or the app cannot update itself.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
